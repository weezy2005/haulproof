[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "haulproof"
version = "0.1.0"
description = "Statistical framework for driverless-readiness decisions in autonomous trucking"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "duckdb>=1.0",
    "pandera>=0.24",
    "plotly>=5.20",
    "requests>=2.31",
    "truststore>=0.9",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35"]
ml = ["lightgbm>=4.3"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/haulproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
